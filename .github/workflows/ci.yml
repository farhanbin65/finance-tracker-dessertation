name: FinSight CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── Backend Syntax Check ───────────────────────────────
  backend:
    name: Backend Python Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check all API files
        working-directory: backend
        run: |
          python -m py_compile app/main.py
          python -m py_compile app/api/auth.py
          python -m py_compile app/api/transactions.py
          python -m py_compile app/api/budgets.py
          python -m py_compile app/api/goals.py
          python -m py_compile app/api/chat.py
          echo "Backend syntax check passed"

  # ── Frontend Build Check ───────────────────────────────
  frontend:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_AUTH0_DOMAIN: ${{ secrets.VITE_AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ secrets.VITE_AUTH0_CLIENT_ID }}
          VITE_AUTH0_CALLBACK_URL: ${{ secrets.VITE_AUTH0_CALLBACK_URL }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build